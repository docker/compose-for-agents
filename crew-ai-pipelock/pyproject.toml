[project]
name = "crew-ai-pipelock"
version = "0.1.0"
description = "CrewAI research agent secured by Pipelock proxy"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[tools]>=0.85.0",
    "crewai-tools[mcp]>=0.4.6",
    "requests>=2.31.0",
]

[project.scripts]
research_agent = "src.agent:run"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11.0"
pyright = ">=1.1.390"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
