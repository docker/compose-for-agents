<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom MCP Gateway UI</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; max-width: 800px; }
    pre { background: #f7f7f7; padding: 0.75rem; border-radius: 6px; overflow: auto; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>Custom MCP Gateway UI</h1>
  <div class="card">
    <p>
      This UI lets you verify the gateway health and see which MCP servers are configured.
    </p>
    <div>
      <button id="checkHealth">Check Health</button>
      <button id="loadConfig">Load Config</button>
    </div>
    <h3>Health</h3>
    <pre id="health">(click Check Health)</pre>
    <h3>Config</h3>
    <pre id="config">(click Load Config)</pre>
  </div>

  <script>
    document.getElementById('checkHealth').onclick = async () => {
      const el = document.getElementById('health');
      el.textContent = 'Loading...';
      try {
        const r = await fetch('/api/health');
        const text = await r.text();
        el.textContent = text;
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
      }
    };

    document.getElementById('loadConfig').onclick = async () => {
      const el = document.getElementById('config');
      el.textContent = 'Loading...';
      try {
        const r = await fetch('/api/config');
        const json = await r.json();
        el.textContent = JSON.stringify(json, null, 2);
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
      }
    };
  </script>
</body>
</html>
